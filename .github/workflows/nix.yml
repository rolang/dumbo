name: Nix

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix.yml'
  push:
    branches: ['**', '!update/**', '!pr/**']
    tags: [v*]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix.yml'

concurrency:
  group: nix @ ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Build & smoke test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check -L

      - name: Build dumbo package
        run: nix build .#dumbo -L

      - name: Smoke test binary
        run: |
          ./result/bin/dumbo -v
          ./result/bin/dumbo help
